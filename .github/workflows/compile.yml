name: Compile Brilliant

on:
  workflow_dispatch:
  push:
    paths:
      - 'brilliant-source.zip'
      - '.github/workflows/compile.yml'

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip cmake build-essential git

      - name: Extract project
        run: |
          mkdir project
          unzip -q brilliant-source.zip -d project

      - name: Find source
        id: source
        run: |
          PWN=$(find project -type f -name brilliant.pwn | head -n 1)
          test -n "$PWN" || { echo "brilliant.pwn not found"; exit 1; }
          echo "pwn=$PWN" >> "$GITHUB_OUTPUT"
          echo "root=$(dirname "$PWN")/.." >> "$GITHUB_OUTPUT"

      - name: Download Pawn compiler
        run: |
          git clone --depth 1 https://github.com/pawn-lang/compiler.git pawn-compiler

      - name: Build Pawn compiler
        run: |
          test -f pawn-compiler/source/compiler/CMakeLists.txt
          cmake -S pawn-compiler/source/compiler -B build-pawn -DCMAKE_BUILD_TYPE=Release
          cmake --build build-pawn -j2
          find build-pawn -type f -name 'pawncc*'

      - name: Compile Brilliant
        run: |
          PAWNCC=$(find build-pawn -type f -name pawncc -perm -111 | head -n 1)
          test -n "$PAWNCC" || { echo "pawncc not found"; exit 1; }
          ROOT="${{ steps.source.outputs.root }}"
          mkdir -p output
          INCLUDES=()
          while IFS= read -r -d '' DIR; do
            INCLUDES+=("-i$DIR")
          done < <(find "$ROOT" -type f -name '*.inc' -printf '%h\0' | sort -zu)
          "$PAWNCC" "${{ steps.source.outputs.pwn }}" "${INCLUDES[@]}" -ooutput/brilliant.amx

      - name: Upload AMX
        uses: actions/upload-artifact@v4
        with:
          name: brilliant-amx
          path: output/brilliant.amx     
