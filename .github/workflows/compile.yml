name: Compile Brilliant

on:
  workflow_dispatch:
  push:
    paths:
      - 'brilliant-source.zip'
      - '.github/workflows/compile.yml'

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip cmake build-essential gcc-multilib g++-multilib git

      - name: Extract project
        run: |
          mkdir project
          unzip -q brilliant-source.zip -d project

      - name: Find source
        id: source
        run: |
          PWN=$(find project -type f -name brilliant.pwn | head -n 1)
          if [ -z "$PWN" ]; then
            echo "ERROR: brilliant.pwn not found"
            exit 1
          fi
          echo "pwn=$PWN" >> $GITHUB_OUTPUT
          echo "root=$(dirname $PWN)/.." >> $GITHUB_OUTPUT
          echo "Found source: $PWN"

      - name: Fix srv
        run: |
          PWN=${{ steps.source.outputs.pwn }}
          if ! grep -q "new srv;" "$PWN"; then
            sed -i 's/gmx_time;/gmx_time;\nnew srv;/' "$PWN"
            echo "Added new srv;"
          else
            echo "new srv; already exists"
          fi

      - name: Download Pawn compiler
        run: |
          git clone --depth 1 https://github.com/pawn-lang/compiler.git pawn-compiler

      - name: Build Pawn compiler
        run: |
          cmake -S pawn-compiler/source/compiler -B build-pawn -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-m32 -DCMAKE_EXE_LINKER_FLAGS=-m32 -DCMAKE_SHARED_LINKER_FLAGS=-m32
          cmake --build build-pawn --target pawncc -j2

      - name: Compile Brilliant
        run: |
          PAWNCC=$(find build-pawn -type f -name pawncc -perm -111 | head -n 1)
          ROOT=${{ steps.source.outputs.root }}
          PWN=${{ steps.source.outputs.pwn }}

          echo "Root: $ROOT"
          echo "Source: $PWN"

          # Исправляем только пути в #include
          find "$ROOT" -type f \( -name "*.pwn" -o -name "*.inc" \) \
            -exec sed -i '/^[[:space:]]*#include/s|\\|/|g' {} +

          mkdir -p output

          # Только необходимые include-пути (чтобы не было segfault)
          "$PAWNCC" "$PWN" \
            -i"$ROOT/pawno/include" \
            -i"$ROOT/include" \
            -i"$ROOT/gamemodes" \
            -i"$ROOT/gamemodes/API" \
            -ooutput/brilliant.amx

      - name: Upload AMX
        uses: actions/upload-artifact@v4
        with:
          name: brilliant-amx
          path: output/brilliant.amx
